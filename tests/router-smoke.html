<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Router Smoke Test</title>
</head>
<body>
<h1>Router Smoke Test</h1>
<p>Open the browser console for the summary. Results are also listed below.</p>
<div id="results">Running...</div>

<script>
  // -----------------------------------------------------------------------
  // Fetch shim -- needed because this page lives at /tests/, not the site
  // root. When the loader is invoked asynchronously (i.e. after initial
  // script execution), document.currentScript is null, so loader.js falls
  // back to window.location.href and resolves content paths relative to
  // /tests/. That sends manifest fetches to /tests/content/..., which does
  // not exist. Rewriting /tests/content/ -> /content/ here keeps the shim
  // contained to the test harness; no engine file is modified.
  //
  // Note: String(input) handles both string arguments and URL objects.
  // loader.js passes a URL object to fetch(), and URL objects expose .href
  // (via toString), not .url.
  //
  // Test-only workaround for a latent loader limitation. Remove once the
  // loader gains proper site-root resolution.
  // -----------------------------------------------------------------------
  (function () {
    var originalFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      var url = String(input);
      var remapped = url.replace("/tests/content/", "/content/");
      if (remapped !== url) {
        return originalFetch(remapped, init);
      }
      return originalFetch(input, init);
    };
  })();
</script>

<script src="../lib/markdown-renderer.js"></script>
<script src="../js/content-engine/loader.js"></script>
<script src="../js/content-engine/parser.js"></script>
<script src="../js/content-engine/transform.js"></script>
<script src="../js/content-engine/templates.js"></script>
<script src="../js/content-engine/router.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var api = window.ContentEngineRouter;
    var resultsEl = document.getElementById("results");

    if (!api) {
      resultsEl.textContent = "router.js did not expose ContentEngineRouter.";
      return;
    }

    api.runRouterSmokeTest().then(function (report) {
      var passed = report.results.filter(function (r) { return r.passed; }).length;

      var summary = document.createElement("p");
      summary.textContent = (report.passed ? "ALL PASSED" : "FAILURES PRESENT") +
        " - " + passed + "/" + report.results.length;
      resultsEl.replaceChildren(summary);

      var list = document.createElement("ul");
      report.results.forEach(function (r) {
        var li = document.createElement("li");
        var label = (r.passed ? "PASS" : "FAIL") + " - " + r.name;
        if (!r.passed && r.error) {
          label += " (" + r.error + ")";
        }
        li.textContent = label;
        list.appendChild(li);
      });
      resultsEl.appendChild(list);
    }).catch(function (error) {
      resultsEl.textContent = "Router smoke test threw: " + (error && error.message ? error.message : error);
      console.error("[router-smoke] unhandled rejection:", error);
    });
  });
</script>
</body>
</html>
