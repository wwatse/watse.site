<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>Open Graph image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
        }

        body {
            background: #ffffff;
            color: #111111;
            padding: 48px;
        }

        .canvas {
            width: 100%;
            height: 100%;
            border: 4px solid #111111;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
        }

        .eyebrow {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .title {
            max-width: 980px;
            margin: 0;
            font-size: 72px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            overflow-wrap: anywhere;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: end;
            border-top: 2px solid #111111;
            padding-top: 18px;
            font-size: 20px;
            font-weight: 500;
        }

        .mark {
            font-weight: 800;
        }
    </style>
</head>
<body>
    <main class="canvas">
        <div class="eyebrow">personal web / blog</div>
        <h1 class="title"><!--TITLE--></h1>
        <footer class="footer">
            <span>kelvin watse</span>
            <span class="mark">watse.me</span>
        </footer>
    </main>
</body>
</html>
